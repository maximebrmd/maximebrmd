<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Terminal: whoami, then a resume download that turns into a rickroll">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; }
    .p { fill: #8a90a2; } .w { fill: #f7f8fc; } .l { fill: #cbbdff; } .g { fill: #ffca00; font-weight: 700; } .d { fill: #8a90a2; }
    .all { animation: all 14s infinite; }
    .c1 { animation: c1 14s infinite; } .c2 { animation: c2 14s infinite; }
    .s2 { animation: s2 14s infinite; } .s4 { animation: s4 14s infinite; } .s5 { animation: s5 14s infinite; }
    .bar { transform-box: fill-box; transform-origin: left; animation: bar 14s infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes all { 0%, 95% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes c1 { 0%, 3.5% { transform: translateX(0); animation-timing-function: steps(8, end) } 9%, 100% { transform: translateX(118px) } }
    @keyframes c2 { 0%, 18% { transform: translateX(0); animation-timing-function: steps(17, end) } 28%, 100% { transform: translateX(258px) } }
    @keyframes s2 { 0%, 11% { opacity: 0 } 12%, 100% { opacity: 1 } }
    @keyframes s4 { 0%, 30% { opacity: 0 } 31%, 100% { opacity: 1 } }
    @keyframes bar { 0%, 31% { transform: scaleX(0); animation-timing-function: cubic-bezier(.3, 0, .2, 1) } 52% { transform: scaleX(.97); animation-timing-function: linear } 58%, 100% { transform: scaleX(1) } }
    @keyframes s5 { 0%, 60% { opacity: 0 } 61%, 100% { opacity: 1 } }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect width="1200" height="340" rx="16" fill="#16171c"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="15.5" fill="none" stroke="#2f323d"/>
  <circle cx="30" cy="24" r="7" fill="#415eee"/><circle cx="54" cy="24" r="7" fill="#b9a6ff"/><circle cx="78" cy="24" r="7" fill="#ffca00"/>
  <text x="600" y="31" text-anchor="middle" class="d" style="font-size:16px">maxime@helsinki: ~</text>
  <g class="all">
    <text x="40" y="100"><tspan class="p">$ </tspan><tspan class="w">whoami</tspan></text>
    <rect class="c1" x="38" y="76" width="130" height="34" fill="#16171c"/>
    <text x="40" y="140" class="s2"><tspan class="w">Maxime Bourmaud.</tspan><tspan class="l"> Founder of Peal, contributor to Lilo.</tspan></text>
    <text x="40" y="195"><tspan class="p">$ </tspan><tspan class="w">open resume.pdf</tspan></text>
    <rect class="c2" x="38" y="171" width="270" height="34" fill="#16171c"/>
    <g class="s4">
      <rect x="40" y="222" width="520" height="18" rx="9" fill="#2a2d38"/>
      <rect class="bar" x="40" y="222" width="520" height="18" rx="9" fill="#b9a6ff"/>
      <text x="584" y="238" class="d">downloading resume.pdf</text>
    </g>
    <g class="s5">
      <text x="40" y="295"><tspan class="g">jk. never gonna give you up.</tspan><tspan class="d">  (click me)</tspan></text>
      <rect class="cur" x="630" y="275" width="13" height="26" fill="#f7f8fc"/>
    </g>
  </g>
</svg>
